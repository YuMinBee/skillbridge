# 푸시·PR마다: 백엔드 테스트(목업 모드, AWS 없이) → 평가 재현(저장된 Bedrock 예측) → 프런트 빌드
name: ci
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      BEDROCK_MOCK: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: 백엔드 테스트
        run: python -m pytest backend/tests -q
      - name: 평가 재현 (저장된 예측과 같은 숫자가 나오는지)
        run: |
          python eval/run_eval.py
          grep -q "0.809" eval/report.md
          grep -q "7.4%" eval/report.md
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: 프런트 빌드
        working-directory: frontend
        run: npm ci && npm run build
