AWSTemplateFormatVersion: "2010-09-09"
Description: >
  역량다리(SkillBridge) 06팀 — FastAPI(Mangum) Lambda + 함수 URL, S3 raw/curated 데이터 레이크,
  Glue 카탈로그 + Athena 워크그룹. 모든 리소스는 스택 태그 project=kosa06을 상속한다.
  배포: python infra/deploy.py (버킷 생성·코드 업로드·스택 생성까지 한 번에)

Parameters:
  DataBucket:
    Type: String
    Description: deploy.py가 먼저 만든 버킷 (코드 zip, raw/, curated/, athena-results/)
  CodeKey:
    Type: String
  ModelId:
    Type: String
  FastModelId:
    Type: String
  EmbedModelId:
    Type: String
    Default: amazon.titan-embed-text-v2:0
  GuardrailId:
    Type: String
    Default: ""
  GuardrailVersion:
    Type: String
    Default: ""
  KbId:
    Type: String
    Default: ""
    Description: infra/build_kb.py가 출력한 기업 지식베이스 ID (비우면 로컬 문서 검색)
  BedrockMock:
    Type: String
    Default: "0"
    AllowedValues: ["0", "1"]
  MaxConcurrency:
    Type: Number
    Default: 10   # 11-22: 2면 화면 파일(CSS·JS)과 분석 작업·진행 조회가 겹쳐 요청이 거절(Throttle)됨 → 10. 비용은 IP·시간당 상한과 분석 예산이 막는다
    MinValue: 1
    MaxValue: 10
  DemoKey:
    Type: String
    Default: ""
    NoEcho: true
    Description: 시연 키 (.env DEMO_KEY). 이 키를 보낸 요청만 Bedrock, 나머지 공개 방문자는 규칙 엔진
  BedrockPerHour:
    Type: String
    Default: "20"
    Description: 인스턴스당 시간당 Bedrock 요청 상한 (넘으면 그 요청은 규칙 엔진)

Resources:
  Table:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: kosa06-skillbridge
      BillingMode: PAY_PER_REQUEST   # 쓴 만큼만 과금
      AttributeDefinitions:
        - { AttributeName: pk, AttributeType: S }
        - { AttributeName: sk, AttributeType: S }
      KeySchema:
        - { AttributeName: pk, KeyType: HASH }
        - { AttributeName: sk, KeyType: RANGE }
      TimeToLiveSpecification: { AttributeName: ttl, Enabled: true }   # 방문자 샌드박스 24시간 뒤 삭제
      SSESpecification: { SSEEnabled: true }

  ApiRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: skillbridge-runtime
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: Bedrock
                Effect: Allow
                Action: [bedrock:InvokeModel, bedrock:InvokeModelWithResponseStream, bedrock:ApplyGuardrail]
                Resource: "*"   # global. 교차 리전 추론 프로필은 호출 리전이 달라 ARN 고정이 어렵다
              - Sid: SelfInvokeJob   # 분석 job: 함수가 자기 자신을 비동기 호출 (adapters/jobs.submit)
                Effect: Allow
                Action: [lambda:InvokeFunction]
                Resource: !Sub arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:kosa06-skillbridge-api
              - Sid: KnowledgeBase
                Effect: Allow
                Action: [bedrock:Retrieve]
                Resource: !Sub arn:aws:bedrock:${AWS::Region}:${AWS::AccountId}:knowledge-base/*
              - Sid: Athena
                Effect: Allow
                Action: [athena:StartQueryExecution, athena:GetQueryExecution, athena:GetQueryResults]
                Resource: !Sub arn:aws:athena:${AWS::Region}:${AWS::AccountId}:workgroup/${Workgroup}
              - Sid: Glue
                Effect: Allow
                Action: [glue:GetDatabase, glue:GetTable, glue:GetPartitions]
                Resource:
                  - !Sub arn:aws:glue:${AWS::Region}:${AWS::AccountId}:catalog
                  - !Sub arn:aws:glue:${AWS::Region}:${AWS::AccountId}:database/${GlueDb}
                  - !Sub arn:aws:glue:${AWS::Region}:${AWS::AccountId}:table/${GlueDb}/*
              - Sid: Store
                Effect: Allow
                Action: [dynamodb:GetItem, dynamodb:PutItem, dynamodb:DeleteItem, dynamodb:Query]
                Resource: !GetAtt Table.Arn
              - Sid: Data
                Effect: Allow
                Action: [s3:GetObject, s3:PutObject, s3:ListBucket, s3:GetBucketLocation]
                Resource:
                  - !Sub arn:aws:s3:::${DataBucket}
                  - !Sub arn:aws:s3:::${DataBucket}/curated/*
                  - !Sub arn:aws:s3:::${DataBucket}/athena-results/*

  ApiFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: kosa06-skillbridge-api
      Runtime: python3.12
      Architectures: [x86_64]
      Handler: lambda_function.handler
      Code: { S3Bucket: !Ref DataBucket, S3Key: !Ref CodeKey }
      Role: !GetAtt ApiRole.Arn
      MemorySize: 1536
      Timeout: 300   # 분석 job은 비동기 자기 호출로 돌아서 HTTP 응답과 무관하게 길어도 된다
      # 비용 보호: 동시 실행 상한 × 인스턴스당 시간당 Bedrock 요청 상한(BEDROCK_PER_HOUR) = 시간당 최대 요청 수
      ReservedConcurrentExecutions: !Ref MaxConcurrency
      Environment:
        Variables:
          STORAGE: dynamodb
          TABLE_NAME: !Ref Table
          ALLOW_BASE_WRITE: "0"   # 공개 주소: 원본 기업 설정 쓰기 금지, 방문자 샌드박스에서만 수정
          RATE_PER_MIN: "8"
          BEDROCK_PER_HOUR: !Ref BedrockPerHour
          BEDROCK_MOCK: !Ref BedrockMock
          DEMO_KEY: !Ref DemoKey
          DATA_MODE: live
          MODEL_ID: !Ref ModelId
          FAST_MODEL_ID: !Ref FastModelId
          EMBED_MODEL_ID: !Ref EmbedModelId
          GUARDRAIL_ID: !Ref GuardrailId
          GUARDRAIL_VERSION: !Ref GuardrailVersion
          KB_ID: !Ref KbId
          ATHENA_WORKGROUP: !Ref Workgroup
          ATHENA_DATABASE: !Ref GlueDb
          DATA_BUCKET: !Ref DataBucket

  ApiUrl:
    Type: AWS::Lambda::Url
    Properties:
      TargetFunctionArn: !Ref ApiFunction
      AuthType: NONE   # 심사·시연용 공개 주소. 이력서 원문은 저장하지 않는다

  ApiUrlPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref ApiFunction
      Action: lambda:InvokeFunctionUrl
      Principal: "*"
      FunctionUrlAuthType: NONE

  ApiUrlInvokePermission:   # 2025년 이후 함수 URL은 InvokeFunction 권한도 함께 필요하다
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref ApiFunction
      Action: lambda:InvokeFunction
      Principal: "*"
      InvokedViaFunctionUrl: true

  ApiLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /aws/lambda/kosa06-skillbridge-api
      RetentionInDays: 14

  GlueDb:
    Type: AWS::Glue::Database
    Properties:
      CatalogId: !Ref AWS::AccountId
      DatabaseInput:
        Name: kosa06_skillbridge
        Description: 역량다리 curated 데이터 (공고 1행 / 공고×스킬 1행)

  PostingsTable:
    Type: AWS::Glue::Table
    Properties:
      CatalogId: !Ref AWS::AccountId
      DatabaseName: !Ref GlueDb
      TableInput:
        Name: postings
        TableType: EXTERNAL_TABLE
        Parameters: { classification: json }
        StorageDescriptor:
          Location: !Sub s3://${DataBucket}/curated/postings/
          InputFormat: org.apache.hadoop.mapred.TextInputFormat
          OutputFormat: org.apache.hadoop.hive.ql.io.HiveIgnoreKeyTextOutputFormat
          SerdeInfo: { SerializationLibrary: org.openx.data.jsonserde.JsonSerDe }
          Columns:
            - { Name: posting_id, Type: string }
            - { Name: source, Type: string }
            - { Name: job, Type: string }
            - { Name: region, Type: string }
            - { Name: month, Type: string }
            - { Name: ncs, Type: "array<string>" }
            - { Name: company, Type: string }

  PostingSkillsTable:
    Type: AWS::Glue::Table
    Properties:
      CatalogId: !Ref AWS::AccountId
      DatabaseName: !Ref GlueDb
      TableInput:
        Name: posting_skills
        TableType: EXTERNAL_TABLE
        Parameters: { classification: json }
        StorageDescriptor:
          Location: !Sub s3://${DataBucket}/curated/posting_skills/
          InputFormat: org.apache.hadoop.mapred.TextInputFormat
          OutputFormat: org.apache.hadoop.hive.ql.io.HiveIgnoreKeyTextOutputFormat
          SerdeInfo: { SerializationLibrary: org.openx.data.jsonserde.JsonSerDe }
          Columns:
            - { Name: posting_id, Type: string }
            - { Name: job, Type: string }
            - { Name: region, Type: string }
            - { Name: month, Type: string }
            - { Name: skill_id, Type: string }
            - { Name: requirement, Type: string }

  ApiAsyncConfig:   # job 실패 시 Lambda가 자동 재시도하면 같은 job이 두 번 돌고 비용도 두 번 → 재시도 0
    Type: AWS::Lambda::EventInvokeConfig
    Properties:
      FunctionName: !Ref ApiFunction
      Qualifier: $LATEST
      MaximumRetryAttempts: 0
      MaximumEventAgeInSeconds: 600

  Workgroup:
    Type: AWS::Athena::WorkGroup
    Properties:
      Name: kosa06-skillbridge
      State: ENABLED
      RecursiveDeleteOption: true
      WorkGroupConfiguration:
        EnforceWorkGroupConfiguration: true
        BytesScannedCutoffPerQuery: 1073741824   # 쿼리당 1GB 상한 (비용 보호)
        ResultConfiguration:
          OutputLocation: !Sub s3://${DataBucket}/athena-results/

Outputs:
  AppUrl:
    Description: 시연 주소 (프런트 + API)
    Value: !GetAtt ApiUrl.FunctionUrl
  Workgroup:
    Value: !Ref Workgroup
